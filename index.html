/* Layout: a single drum of chapters (one headline each) turned by scroll or swipe; tapping the chapter in focus opens its page,
   a paper sheet with the detail, any media, and a small knowledge graph of how it connects to the other chapters. */
:root{
  --green:#0e2e24; --green-2:#123a2e; --ink:#f3ecdc; --muted:#b9b29c; --gold:#d9b871; --line:#ffffff22;
  --paper:#ffffff; --paper-ink:#2a241b; --paper-soft:#5e503b; --navy:#22384a; --accent:#8a6224;
  --display:"Cormorant Garamond",Georgia,serif; --body:Spectral,Georgia,serif; --caps:"Spectral SC",Spectral,Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--green)}
body{margin:0;color:var(--ink);font-family:var(--body);background:radial-gradient(ellipse at 50% 45%,#1d4a3a 0%,var(--green) 55%,#08201a 100%) fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.top{position:fixed;z-index:4;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.mark{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.1;pointer-events:auto;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.mark small{display:block;font-family:var(--caps);font-size:10.5px;letter-spacing:.22em;color:var(--muted)}
.links{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{font:13px/1 var(--body);background:#0b2219cc;border:1px solid var(--line);border-radius:999px;padding:9px 14px;min-height:36px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip:hover{border-color:#ffffff66}
.chip.gold{color:var(--gold);border-color:#d9b87166}

.bg-tint{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#0e2e2400 0%,#0e2e2466 55%,#06150fcc 100%)}
.item .main,.item .sub,.item .k{text-shadow:0 2px 18px #06150f}

/* ---------- the drum ---------- */
.scene{position:fixed;inset:0;display:grid;place-items:center;perspective:1300px;overflow:hidden;z-index:1}
.wheel{position:relative;width:min(860px,100%);height:0;transform-style:preserve-3d;will-change:transform}
.item{position:absolute;left:0;right:0;top:0;transform-origin:50% 0;transform-style:preserve-3d;backface-visibility:hidden;text-align:center;padding:0 12px}
.item > button{all:unset;display:block;width:100%;cursor:pointer;transform:translateY(-50%);border-radius:14px;padding:10px 6px}
.item > button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.item .k{font-family:var(--caps);font-size:12px;letter-spacing:.3em;color:var(--gold);display:block;margin-bottom:8px}
.item .main{font-family:var(--display);font-weight:600;font-size:clamp(28px,4.3vw,50px);line-height:1.08;display:block;text-wrap:balance}
.item .sub{font-style:italic;color:var(--muted);font-size:clamp(14px,1.4vw,17px);display:block;margin-top:10px;text-wrap:balance}
.item .open{display:inline-block;margin-top:14px;font-family:var(--caps);font-size:12px;letter-spacing:.2em;color:var(--gold);border-bottom:1px solid #d9b87188;padding-bottom:3px;opacity:0;transition:opacity .3s}
.item.focus .open{opacity:1}
.item.intro .main{font-size:clamp(46px,8vw,92px)}
.item.sep{pointer-events:none;color:#d9b87199;font-size:20px;letter-spacing:.5em}
.item.sep > span{display:block;transform:translateY(-50%)}

.rail{position:fixed;z-index:3;right:max(14px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px}
.rail button{background:none;border:0;padding:5px 6px;cursor:pointer;font-family:var(--caps);font-size:10.5px;letter-spacing:.18em;color:#b9b29c88;text-align:right}
.rail button[aria-current="true"]{color:var(--gold)}
.rail button:hover{color:var(--ink)}
.hint{position:fixed;z-index:3;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;font-style:italic;color:var(--muted);font-size:14px;pointer-events:none;transition:opacity .6s}
.spacer{width:1px}
@media (max-width:700px){.rail{display:none}.mark{font-size:18px}}
/* the chapter list on the right only where there is room beside the headlines */
@media (max-width:1099px){.rail{display:none}}
/* large desktop screens (iMac and up): scale the type and pages so nothing looks lost */
@media (min-width:1900px){
  .wheel{width:min(1240px,100%)}
  .item .k{font-size:15px}
  .item .main{font-size:clamp(50px,3vw,76px)}
  .item.intro .main{font-size:clamp(92px,5.4vw,132px)}
  .item .sub{font-size:21px;max-width:900px;margin-left:auto;margin-right:auto}
  .item .open{font-size:14px}
  .top,.rail,.hint,.sheetbar{zoom:1.3}
  .paper{zoom:1.3}
}
.graph{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:700px){.graph svg{min-width:620px}.map .graph svg{min-width:760px}}

/* ---------- chapter page ---------- */
.sheet{position:fixed;inset:0;z-index:6;overflow-y:auto;background:#06150fcc;backdrop-filter:blur(6px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet[hidden]{display:none}
.paper{width:min(860px,calc(100% - 24px));margin:calc(64px + env(safe-area-inset-top,0px)) auto calc(40px + env(safe-area-inset-bottom,0px));background:var(--paper);color:var(--paper-ink);
  border-radius:6px;box-shadow:0 30px 80px #000c;padding:clamp(24px,5vw,56px);position:relative;animation:rise .45s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.paper{animation:none}.item .open{transition:none}.hint{transition:none}}
.sheetbar{position:fixed;z-index:7;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:8px;pointer-events:none}
.sheetbar .chip{pointer-events:auto;background:#0b2219ee}
.paper .num{font-family:var(--caps);font-size:12px;letter-spacing:.3em;color:var(--accent)}
.paper h1{font-family:var(--display);font-weight:600;font-size:clamp(40px,7vw,68px);line-height:.98;margin:6px 0 14px;color:var(--green)}
.paper .lede{font-family:var(--display);font-weight:600;font-size:clamp(22px,3vw,30px);line-height:1.2;margin:0;color:var(--paper-ink);text-wrap:balance}
.paper .ledesub{font-style:italic;color:var(--paper-soft);margin:8px 0 0}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(18px,4vw,40px);align-items:center;margin-bottom:26px}
@media (max-width:680px){.hero{grid-template-columns:1fr}}
.plate{background:#fbf6ec;padding:10px;box-shadow:0 10px 26px #0002;outline:1px solid #c9a96a88;outline-offset:-5px}
.plate img{display:block;width:100%;height:auto}
.quote{border-left:3px solid var(--accent);padding-left:14px;margin:0}
.hero.solo{grid-template-columns:1fr;max-width:420px}
.hero.solo > div:first-child:empty{display:none}
.quote p{font-family:var(--display);font-style:italic;font-size:21px;line-height:1.3;color:var(--navy);margin:0}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduce = matchMedia('(prefers-reduced-motion:reduce)');

const hangzhouTime = () => new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Shanghai' }).format(new Date());
// page illustrations are switched off for now; set to true to bring them back
const SHOW_ART = false;
const art = (n, alt = '') => SHOW_ART && n && CV_ART_DATA[n] ? `<div class="plate"><img src="${CV_ART_DATA[n]}" alt="${esc(alt)}" loading="lazy" decoding="async"></div>` : '';
const chTitle = (p) => (p.pre + ' ' + p.word).toLowerCase().replace(/^./, (c) => c.toUpperCase()).replace(/\bi\b/g, 'I').replace('reuben', 'Reuben');

/* ---- one headline and one supporting line per chapter ---- */
const HEAD = {
  ONE: ['A problem solver who designs around how people actually behave.', 'Works across engineering, design and education, and across cultures.'],
  TWO: ['Turns messy problems into clear questions, then builds what answers them.', 'Problem framing, behavior-aware design, fast prototyping, review, auditing and leadership.'],
  THREE: ['Measures what people do as well as what they say.', 'Eye tracking, motion capture, workload ratings and driving simulation, tied together by careful study design.'],
  FOUR: ['Brought driver workload into the SAE levels of driving automation, with a way to measure it.', 'SAE defines each level only by what the driver must do; workload was never part of it. DWAM quantifies whether, where and in which direction workload changes.'],
  FIVE: ['Shapes how organisations and classrooms work, with results to show.', 'Restructured a mining services firm that went on to win overseas contracts; AI curricula from age 9 to adult learners; every pupil through the BECE.'],
  SIX: ['Engineering degrees on two continents, in two languages.', 'BSc Ghana, MEng Lanzhou, PhD Zhejiang (expected 2027), and HSK 5 Mandarin.'],
  SEVEN: ['Argues that systems should adapt to people, not the other way round.', 'The Tyranny of the Default: toward a user behavior architecture.'],
  EIGHT: ['Recognised along the way.', 'One of 582 international students honoured by China’s Ministry of Education; best student paper, 2023; valedictorian, 2020.']
};

const CHAPTERS = [];
PAGES.forEach((p, i) => {
  if (p.kind === 'opener') CHAPTERS.push({ id: p.num, page: p, title: chTitle(p), content: [] });
  else if (CHAPTERS.length && p.kind !== 'closing') CHAPTERS[CHAPTERS.length - 1].content.push(p);
});
const byId = Object.fromEntries(CHAPTERS.map((c) => [c.id, c]));

/* ---- knowledge graph: shared threads between chapters, each grounded in the CV text ---- */
const THREADS = [
  { t: 'Driver workload', ch: ['THREE', 'FOUR', 'SEVEN'] },
  { t: 'Eye tracking and motion capture', ch: ['THREE', 'FOUR'] },
  { t: 'Driving simulation', ch: ['THREE', 'FOUR'] },

/* ---------- the drum ---------- */
const ITEMS = [{ kind: 'intro' }];
CHAPTERS.forEach((c) => ITEMS.push({ kind: 'ch', c }));
ITEMS.push({ kind: 'contact' });
const STOPS = ITEMS.map((it, i) => it.kind === 'sep' ? null : i).filter((i) => i !== null);

const wheel = $('wheel'), bgSoft = $('bgSoft'), bgBlur = $('bgBlur');
let ANGLE = 15, RADIUS = 520, STEP = 260;
function itemHtml(it) {
  if (it.kind === 'sep') return '<span>✦</span>';
  if (it.kind === 'intro') return `<button type="button" data-open="ONE"><span class="k">Curriculum vitae</span><span class="main">Reuben ASK</span><span class="sub">User Behavior Architect · Hangzhou · local time <span class="clock">${hangzhouTime()}</span></span></button>`;
  if (it.kind === 'contact') return `<button type="button" data-open="CONTACT"><span class="k">Contact</span><span class="main">Frame. Measure. Build.</span><span class="sub">Email, ORCID, LinkedIn and the full CV</span><span class="open">Open</span></button>`;
  const [line, sub] = HEAD[it.c.id];
  return `<button type="button" data-open="${it.c.id}"><span class="k">${esc(it.c.id)} · ${esc(it.c.title)}</span><span class="main">${esc(line)}</span><span class="sub">${esc(sub)}</span><span class="open">Open chapter</span></button>`;
}
ITEMS.forEach((it, i) => {
  const el = document.createElement('div');
  el.className = 'item' + (it.kind === 'sep' ? ' sep' : '') + (it.kind === 'intro' ? ' intro' : '');
  el.innerHTML = itemHtml(it);
  it.el = el;
  wheel.appendChild(el);
});
$('rail').innerHTML = STOPS.map((i) => {
  const it = ITEMS[i];
  const label = it.kind === 'intro' ? '·' : it.kind === 'contact' ? 'CONTACT' : it.c.id;
  const name = it.kind === 'intro' ? 'Start' : it.kind === 'contact' ? 'Contact' : `Chapter ${it.c.id.toLowerCase()}: ${it.c.title}`;
  return `<button type="button" data-stop="${i}" aria-label="${esc(name)}">${label}</button>`;
}).join('');

function layout() {
  // neighbours sit about half a screen above and below the chapter in focus
  ANGLE = 22;
  // keep the tallest headline block clear of its neighbours, whatever the screen size
  const tallest = Math.max(...ITEMS.map((it) => it.el.querySelector('button')?.offsetHeight || 0));
  const gap = Math.max(innerHeight * (innerWidth < 700 ? .44 : .4), tallest + 56);
  RADIUS = Math.round(gap / Math.sin(ANGLE * Math.PI / 180));
  STEP = Math.max(220, innerHeight * .5);
  ITEMS.forEach((it, i) => { it.el.style.transform = `rotateX(${-i * ANGLE}deg) translateZ(${RADIUS}px)`; });
  $('spacer').style.height = ((ITEMS.length - 1) * STEP + innerHeight) + 'px';
}
let rot = 0, target = 0, raf = 0, current = -1;
function paint() {
  raf = 0;
  rot += (target - rot) * (reduce.matches ? 1 : .14);
  if (Math.abs(target - rot) < .001) rot = target;
  wheel.style.transform = `translateZ(${-RADIUS}px) rotateX(${rot * ANGLE}deg)`;
  const nearest = Math.round(rot);
  ITEMS.forEach((it, i) => {
    const d = Math.abs(i - rot);
    it.el.style.opacity = Math.max(0, 1 - d * .72).toFixed(3);
    it.el.style.visibility = d > 1.6 ? 'hidden' : 'visible';
    const btn = it.el.querySelector('button');
    if (btn) btn.tabIndex = d < .6 ? 0 : -1;
    it.el.classList.toggle('focus', i === nearest);
  });
  const stop = STOPS.reduce((a, b) => Math.abs(b - rot) < Math.abs(a - rot) ? b : a, STOPS[0]);
  if (stop !== current) { current = stop; $('rail').querySelectorAll('button').forEach((b) => b.setAttribute('aria-current', String(+b.dataset.stop === stop))); }
  // the cover is clear behind the name, then softens into a blur once the chapters start
  const t = Math.min(1, Math.max(0, rot / .8));
  bgBlur.style.opacity = t.toFixed(3); bgSoft.style.opacity = (1 - t).toFixed(3);
  if (rot !== target) raf = requestAnimationFrame(paint);
}
function kick() { if (!raf) raf = requestAnimationFrame(paint); }
let snapTimer = 0;
function onScroll() {
  target = scrollY / STEP; kick();
  if (scrollY > 40) $('hint').style.opacity = '0';
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => { // settle on the nearest chapter, never on a separator
    const pos = scrollY / STEP;
    const stop = STOPS.reduce((a, b) => Math.abs(b - pos) < Math.abs(a - pos) ? b : a, STOPS[0]);
    if (Math.abs(stop - pos) > .02 && $('sheet').hidden) goStop(stop);
  }, 160);
}
function goStop(i) { scrollTo({ top: i * STEP, behavior: reduce.matches ? 'auto' : 'smooth' }); }
addEventListener('scroll', onScroll, { passive: true });
addEventListener('resize', () => { layout(); onScroll(); });
$('rail').addEventListener('click', (e) => { const b = e.target.closest('[data-stop]'); if (b) goStop(+b.dataset.stop); });
wheel.addEventListener('click', (e) => {
  const b = e.target.closest('[data-open]'); if (!b) return;
  const idx = ITEMS.findIndex((it) => it.el.contains(b));
  if (Math.abs(idx - rot) > .6) { goStop(idx); return; } // tapping a faded item brings it forward first
  openChapter(b.dataset.open);
});
addEventListener('keydown', (e) => {
  if (!$('sheet').hidden) { if (e.key === 'Escape') closeSheet(); return; }
  const pos = Math.round(scrollY / STEP);
  const i = STOPS.findIndex((s) => s >= pos);
  if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === 'j') { e.preventDefault(); goStop(STOPS[Math.min(STOPS.length - 1, (STOPS[i] === pos ? i + 1 : i))]); }
  if (e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === 'k') { e.preventDefault(); goStop(STOPS[Math.max(0, i - 1)]); }
  if (e.key === 'Enter' && e.target === document.body) { const it = ITEMS[Math.round(rot)]; it?.el.querySelector('button')?.click(); }
});
setInterval(() => document.querySelectorAll('.clock').forEach((c) => c.textContent = hangzhouTime()), 30000);

/* ---------- chapter page ---------- */
function blocksHtml(p) {
  let html = '';
  const bullets = [];
  const flush = () => { if (bullets.length) { html += `<ul>${bullets.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>`; bullets.length = 0; } };
  for (const b of p.blocks || []) {
    if (b.b) { bullets.push(b.b); continue; }
    flush();
    if (b.h) html += `<h3>${esc(b.h)}</h3>`;
    if (b.meta) html += `<p class="meta">${esc(b.meta)}</p>`;
    if (b.p) html += `<p>${esc(b.p)}</p>`;
    if (b.stat) html += `<div class="stat"><b>${esc(b.stat)}</b><span>${esc(b.label)}</span></div>`;
    if (b.impact) html += impactHtml(b.impact);
    if (b.uses) html += usesHtml(b.uses);
    if (b.tabs) html += tabsHtml(b.tabs);
    if (b.groups) html += b.groups.map((g) => `<section class="sgroup"><p class="gn">${esc(g.n)}</p><div><h3 class="gt">${esc(g.t)}</h3>${g.items.map((it) => `<p class="sh">${esc(it.h)}</p><p class="sp">${esc(it.p)}</p>`).join('')}</div></section>`).join('');
  }
  flush();
  return html;
}
// outcomes sit in their own marked box, numbers first, so impact can be found at a glance
function impactHtml(list) {
  const stats = list.filter((x) => typeof x === 'object'), lines = list.filter((x) => typeof x === 'string');
  return `<div class="impact"><p class="tag">Impact</p>${stats.map((x) => `<div class="stat"><b>${esc(x.stat)}</b><span>${esc(x.label)}</span></div>`).join('')}${lines.length ? `<ul>${lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}</div>`;
}
// a method is only meaningful next to the work it was used in
const CH_NAME = { FOUR: 'Four · The research', FIVE: 'Five · Beyond the lab' };
function usesHtml(list) {
  return `<div class="uses">${list.map((u) => `<div class="use"><p class="tool">${esc(u.tools)}</p><p class="where"><span class="tag">Used in</span>${esc(u.where)}${u.go ? ` <button type="button" class="golink" data-nav="${u.go}">${esc(CH_NAME[u.go] || u.go)} →</button>` : ''}</p></div>`).join('')}</div>`;
}
// methods as four tabs: approach, instrument, and the work it served
let tabSeq = 0;
function tabsHtml(tabs) {
  const id = 'mt' + (++tabSeq);
  const list = tabs.map((t, i) => `<button type="button" role="tab" id="${id}-t${i}" aria-controls="${id}-p${i}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}"><span class="tn">${String(i + 1).padStart(2, '0')}</span><span class="tl">${esc(t.label)}</span></button>`).join('');
  const panels = tabs.map((t, i) => `<div class="mpanel" role="tabpanel" id="${id}-p${i}" aria-labelledby="${id}-t${i}"${i ? ' hidden' : ''}>
    <div class="mhead"><p class="mn">${esc(t.n)}</p><div><h3 class="mt">${esc(t.t)}</h3><p class="msub">${esc(t.sub)}</p></div></div>
    <div class="mbody">
      ${t.applied ? `<p class="applied"><span>Applied in</span><em>${esc(t.applied)}</em></p>` : ''}
      ${t.rows.map((r) => `<div class="mrow"><p class="mtool">${esc(r.tool)}</p><div>${r.desc.map((d) => `<p class="mdesc">${esc(d)}</p>`).join('')}${r.tag ? `<p class="mtag">${esc(r.tag)}</p>` : ''}</div></div>`).join('')}
      ${t.pull ? `<p class="mpull">${esc(t.pull)}</p>` : ''}
      <p class="mnext"><span>Continue reading →</span>${t.next.map((n) => `<button type="button" class="golink2" data-nav="${n.go}">${esc(n.label)}</button>`).join(' &amp; ')}</p>
    </div></div>`).join('');
  return `<div class="mtabs" data-tabs><div class="mtablist" role="tablist" aria-label="Methods">${list}</div>${panels}
    <div class="mpager"><button type="button" class="mprev" aria-label="Previous method">←</button><span class="mcur">${esc(tabs[0].label)}</span><button type="button" class="mnext2" aria-label="Next method">→</button><span class="mcount">01 / ${String(tabs.length).padStart(2, '0')}</span></div></div>`;
}
function wireTabs(root) {
  root.querySelectorAll('[data-tabs]').forEach((box) => {
    const tabs = [...box.querySelectorAll('[role=tab]')], panels = [...box.querySelectorAll('[role=tabpanel]')];
    let cur = 0;
    const show = (i, focus) => {
      cur = Math.max(0, Math.min(tabs.length - 1, i));
      tabs.forEach((t, k) => { t.setAttribute('aria-selected', String(k === cur)); t.tabIndex = k === cur ? 0 : -1; });
      panels.forEach((p, k) => { p.hidden = k !== cur; });
      box.querySelector('.mcur').textContent = tabs[cur].querySelector('.tl').textContent;
      box.querySelector('.mcount').textContent = `${String(cur + 1).padStart(2, '0')} / ${String(tabs.length).padStart(2, '0')}`;
      box.querySelector('.mprev').disabled = cur === 0; box.querySelector('.mnext2').disabled = cur === tabs.length - 1;
      if (focus) tabs[cur].focus();
    };
    tabs.forEach((t, i) => { t.onclick = () => show(i); t.onkeydown = (e) => { if (e.key === 'ArrowRight') show(cur + 1, true); if (e.key === 'ArrowLeft') show(cur - 1, true); }; });
    box.querySelector('.mprev').onclick = () => show(cur - 1);
    box.querySelector('.mnext2').onclick = () => show(cur + 1);
    show(0);
  });
}
function whoHtml() {
  return `<h2>Reuben Seyram Komla Agbozo</h2><p class="meta">Human Factors Researcher · User Behavior Architect</p>
  <p>I am a problem solver and user behavior architect focused on how people think, act and adapt within systems.</p>
  <p>I notice what isn't working for people, define the real problem, and build practical solutions: products, prototypes, learning programs and the way an organisation runs.</p>
  <p>I have founded and led a team from scratch, designed AI curricula and trained teachers to use AI, and developed a company's organisational structure and standardised ways of measuring its goals.</p>
  <p>I work across engineering, design and education, and across cultures in English and Mandarin, turning complex ideas into things people can use.</p>`;
}
function mediaHtml(list) {
  return (list || []).map((m) => m.type === 'video'
    ? `<figure class="media-block"><video controls playsinline preload="metadata" src="${esc(m.src)}"${m.poster ? ` poster="${esc(m.poster)}"` : ''}></video>${m.caption ? `<figcaption>${esc(m.caption)}</figcaption>` : ''}</figure>`
    : `<figure class="media-block"><img src="${esc(m.src)}" alt="${esc(m.caption || '')}" loading="lazy">${m.caption ? `<figcaption>${esc(m.caption)}</figcaption>` : ''}</figure>`).join('');
}

/* radial graph: this chapter at the centre, its threads around it, and the chapters those threads lead to on the outside */
function graphSvg(centerId) {
  const W = 760, H = 520, cx = W / 2, cy = H / 2;
  const threads = THREADS.filter((t) => t.ch.includes(centerId));
  const others = [...new Set(threads.flatMap((t) => t.ch).filter((c) => c !== centerId))];
  const r1 = 150, r2 = 235;
  const pos = {};
  others.forEach((c, i) => { const a = -Math.PI / 2 + (i + .5) * 2 * Math.PI / others.length; pos[c] = [cx + Math.cos(a) * r2 * 1.35, cy + Math.sin(a) * r2]; });
  const tpos = threads.map((t, i) => {
    const linked = t.ch.filter((c) => c !== centerId && pos[c]);
    let a;
    if (linked.length) { const v = linked.reduce((s, c) => [s[0] + pos[c][0] - cx, s[1] + pos[c][1] - cy], [0, 0]); a = Math.atan2(v[1], v[0]); }
    else a = -Math.PI / 2 + i * 2 * Math.PI / threads.length;
    return { t, a };
  });
  // spread threads that would overlap
  tpos.sort((p, q) => p.a - q.a);
  const minGap = 2 * Math.PI / Math.max(6, tpos.length) * .9;
  for (let k = 0; k < 3; k++) for (let i = 1; i < tpos.length; i++) if (tpos[i].a - tpos[i - 1].a < minGap) tpos[i].a = tpos[i - 1].a + minGap;
  tpos.forEach((p) => { p.x = cx + Math.cos(p.a) * r1 * 1.45; p.y = cy + Math.sin(p.a) * r1; });
  let edges = '', nodes = '';
  tpos.forEach((p, i) => {
    edges += `<path class="edge" data-t="${i}" d="M${cx},${cy} L${p.x},${p.y}"/>`;
    p.t.ch.filter((c) => c !== centerId).forEach((c) => { edges += `<path class="edge" data-t="${i}" d="M${p.x},${p.y} L${pos[c][0]},${pos[c][1]}"/>`; });
    const w = p.t.t.length * 6.6 + 20;
    nodes += `<g class="cnode" data-t="${i}" transform="translate(${p.x},${p.y})"><rect x="${-w / 2}" y="-14" width="${w}" height="28" rx="14"/><text text-anchor="middle" dy="4.5">${esc(p.t.t)}</text></g>`;
  });
  others.forEach((c) => {
    const ch = byId[c]; const [x, y] = pos[c];
    const below = y > cy;
    nodes += `<g class="chnode" tabindex="0" role="link" data-go="${c}" aria-label="Open chapter ${c.toLowerCase()}: ${esc(ch.title)}" transform="translate(${x},${y})"><circle r="9"/><text class="n" text-anchor="middle" y="${below ? 28 : -30}">${c}</text><text text-anchor="middle" y="${below ? 45 : -14}">${esc(ch.title)}</text></g>`;
  });
  const me = byId[centerId];
  nodes += `<g class="chnode self" transform="translate(${cx},${cy})"><circle r="13"/><text text-anchor="middle" y="34">${esc(me.title)}</text></g>`;
  return `<svg viewBox="-40 -20 ${W + 80} ${H + 40}" role="img" aria-label="Skills from ${esc(me.title)} that also appear in other chapters">${edges}${nodes}</svg>`;
}
/* the whole map: chapters on a ring, threads inside, each thread placed between the chapters it joins */
function mapSvg() {
  const W = 900, H = 640, cx = W / 2, cy = H / 2, R = 280;
  const pos = {};
  CHAPTERS.forEach((c, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / CHAPTERS.length; pos[c.id] = [cx + Math.cos(a) * R * 1.3, cy + Math.sin(a) * R]; });
  let edges = '', nodes = '';
  THREADS.forEach((t, i) => {
    const pts = t.ch.map((c) => pos[c]);
    let x = pts.reduce((s, p) => s + p[0], 0) / pts.length, y = pts.reduce((s, p) => s + p[1], 0) / pts.length;
    x = cx + (x - cx) * .78 + ((i % 3) - 1) * 24; y = cy + (y - cy) * .78 + ((i % 2) ? 14 : -14);
    t.ch.forEach((c) => { edges += `<path class="edge" data-t="${i}" d="M${x},${y} L${pos[c][0]},${pos[c][1]}"/>`; });
    const w = t.t.length * 6.6 + 20;
    nodes += `<g class="cnode" data-t="${i}" transform="translate(${x},${y})"><rect x="${-w / 2}" y="-14" width="${w}" height="28" rx="14"/><text text-anchor="middle" dy="4.5">${esc(t.t)}</text></g>`;
  });
  CHAPTERS.forEach((c) => {
    const [x, y] = pos[c.id]; const below = y > cy + 10;
    nodes += `<g class="chnode" tabindex="0" role="link" data-go="${c.id}" aria-label="Open chapter ${c.id.toLowerCase()}: ${esc(c.title)}" transform="translate(${x},${y})"><circle r="11"/><text class="n" text-anchor="middle" y="${below ? 30 : -32}">${c.id}</text><text text-anchor="middle" y="${below ? 47 : -16}">${esc(c.title)}</text></g>`;
  });
  return `<svg viewBox="-60 -50 ${W + 120} ${H + 100}" role="img" aria-label="Skill map across all chapters">${edges}${nodes}</svg>`;
}
function wireGraph(root) {
  root.querySelectorAll('[data-go]').forEach((g) => {
    const go = () => openChapter(g.dataset.go);
    g.addEventListener('click', go);
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  root.querySelectorAll('.cnode').forEach((n) => {
    const set = (on) => { root.querySelectorAll(`[data-t="${n.dataset.t}"]`).forEach((el) => el.classList.toggle('hot', on)); };
    n.addEventListener('pointerenter', () => set(true));
    n.addEventListener('pointerleave', () => set(false));
  });
}

let lastFocus = null;
function showSheet(html, map) {
  if ($('sheet').hidden) lastFocus = document.activeElement;
  const paper = $('paper');
  paper.innerHTML = html;
  $('sheet').classList.toggle('map', !!map);
  $('sheet').hidden = false; $('sheet').scrollTop = 0;
  document.body.classList.add('locked');
  // restart the entrance animation for each page
  paper.style.animation = 'none'; paper.offsetHeight; paper.style.animation = '';
  paper.focus({ preventScroll: true });
  wireGraph(paper);
  wireTabs(paper);
  paper.querySelectorAll('.graph').forEach((g) => { g.scrollLeft = (g.scrollWidth - g.clientWidth) / 2; });
  paper.querySelectorAll('[data-nav]').forEach((b) => b.onclick = () => openChapter(b.dataset.nav));
  paper.querySelectorAll('[data-map]').forEach((b) => b.onclick = openMap);
}
function closeSheet() {
  if ($('sheet').hidden) return;
  $('paper').querySelectorAll('video').forEach((v) => v.pause());
  $('sheet').hidden = true; document.body.classList.remove('locked');
  lastFocus?.focus?.({ preventScroll: true });
}
$('back').onclick = closeSheet;
$('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) closeSheet(); });

function pager(id) {
  const order = [...CHAPTERS.map((c) => c.id), 'CONTACT'];
  const i = order.indexOf(id);
  const name = (k) => k === 'CONTACT' ? 'Contact' : `${k.charAt(0) + k.slice(1).toLowerCase()} · ${byId[k].title}`;
  const prev = i > 0 ? `<button type="button" data-nav="${order[i - 1]}">← ${esc(name(order[i - 1]))}</button>` : '<span></span>';
  const next = i < order.length - 1 ? `<button type="button" data-nav="${order[i + 1]}">${esc(name(order[i + 1]))} →</button>` : '<span></span>';
  return `<nav class="pager" aria-label="Other chapters">${prev}${next}</nav>`;
}
function openChapter(id) {
  if (id === 'CONTACT') return openContact();
  const c = byId[id]; const p = c.page; 
  let html = `<p class="num">CHAPTER ${esc(id)}</p><h1 id="sheetTitle">${esc(c.title)}</h1>
    ${SHOW_ART && p.art ? `<div class="hero solo">${art(p.art)}</div>` : ''}`;
  html += mediaHtml(MEDIA[id]);
  for (const sp of c.content) {
    if (sp.kind === 'who') { html += whoHtml(); continue; }
    const body = `<div>${sp.sub ? `<p class="meta">${esc(sp.sub)}</p>` : ''}${blocksHtml(sp)}</div>`;
    html += `<h2>${esc(sp.title)}</h2><div class="sec${SHOW_ART && sp.art ? ' withart' : ''}">${body}${sp.art ? art(sp.art) : ''}</div>`;
  }
  html += `<h2>How my skills connect</h2><div class="graph"><p class="note">Skills from this chapter that were also used in other chapters. Tap a chapter to go there.</p>${graphSvg(id)}</div>`;
  html += pager(id);
  showSheet(html);
  goStop(ITEMS.findIndex((it) => it.c && it.c.id === id));
}
function openContact() {
  const html = `<div class="colophon">
    <p class="num">THE NEXT CHAPTER</p>
    <h1 id="sheetTitle" class="cbig">Frame. Measure.<br><em>Build.</em></h1>
    <p class="cinvite">Have a question worth working on?<br>Let’s begin a conversation.</p>
    <a class="cmail" href="mailto:reuben@zju.edu.cn">reuben@zju.edu.cn <span aria-hidden="true">↗</span></a>
    <div class="cgrid">
      <div><p class="cl">Elsewhere</p><p><a href="https://reubenask.com" target="_blank" rel="noopener">reubenask.com <span aria-hidden="true">↗</span></a></p></div>
      <div><p class="cl">Publications</p><p><a href="https://orcid.org/0000-0001-8147-7609" target="_blank" rel="noopener">ORCID profile <span aria-hidden="true">↗</span></a></p></div>
      <div><p class="cl">LinkedIn</p><p>Reuben ASK</p></div>
      <div><p class="cl">Professional record</p><p><a href="Reuben_Agbozo_CV.pdf" target="_blank" rel="noopener">Full CV · PDF</a></p></div>
    </div>
    <div class="csign"><p class="cname">Reuben ASK</p><p class="cwhere">Hangzhou, China · local time <span class="clock">${hangzhouTime()}</span><br>References available on request.</p></div>
    <div class="cfoot"><span>The human in the system</span><em>Fin.</em></div>
  </div>` + pager('CONTACT');
  showSheet(html);
  goStop(ITEMS.length - 1);
}
function openMap() {
  showSheet(`<p class="num">SKILL MAP</p><h1 id="sheetTitle">How my skills connect</h1>
    <p class="lede">The skills that run through more than one chapter.</p>
    <p class="ledesub">Point at a skill to see which chapters use it. Tap a chapter to open it.</p>
    <div class="graph">${mapSvg()}</div>`, true);
}
$('mapBtn').onclick = openMap;

// swipe sideways on a chapter page to move to the next or previous chapter
(() => {
  let sx = 0, sy = 0;
  $('sheet').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $('sheet').addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const btns = $('paper').querySelectorAll('.pager [data-nav]');
    const pick = dx < 0 ? [...btns].find((b) => b.textContent.trim().endsWith('→')) : [...btns].find((b) => b.textContent.trim().startsWith('←'));
    pick?.click();
  }, { passive: true });
})();

layout(); onScroll(); paint();
document.fonts?.ready.then(() => { layout(); onScroll(); });
</script>
